name: Bazar & Myket 24h Telegram Radar + GitHub Pages

on:
  schedule:
    # اجرای خودکار هر ۲۴ ساعت یک‌بار (ساعت ۰۶:۰۰ به وقت UTC معادل ۰۹:۳۰ صبح ایران)
    - cron: '0 6 * * *'
  workflow_dispatch: # امکان اجرای دستی در هر لحظه از تب Actions گیت‌هاب
  push:
    branches: [ main, master ]
    paths:
      - 'bot.py'
      - '.github/workflows/daily-radar.yml'

permissions:
  contents: write

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CafeBazaar & Myket Newest Apps Radar (Updates apps_data.json for github.io)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_APPS_PER_CATEGORY: '24'
        run: |
          python bot.py

      - name: Commit & Push Updated seen_apps.json & apps_data.json (Updates github.io Page)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_apps.json apps_data.json
          git diff --staged --quiet || (git commit -m "chore: update radar apps_data.json & seen_apps.json [skip ci]" && git push)
